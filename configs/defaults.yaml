schema_version: 1
market_selection:
  strategy: latest_complete
  maximum_reference_age_months: 12
  profile_ids: []
  whole_home_rent_source: per_m2
  allow_pooled_property_proxy: false
saving_months: 84
retained_reserve_eur: 5000
household_nonhousing_expenses:
  # Effective spending of the saving pool, including only bills paid outside rent.
  # Change milestones explicitly when included utilities change cash spending.
  interpolation: step
  milestones:
    - month_offset: 0
      amount_eur: 900
mortgage:
  financed_fraction: 0.80
  maximum_debt_ratio: 0.35
  term_years: 25
purchase_costs:
  policy: proportional
  allowance_fraction: 0.10
target_property:
  property_type: flat
  area_m2: 80
  condition: ordinary
