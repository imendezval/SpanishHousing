# Two savers, one borrower. Each stage prices one unit for the combined pool.
# Included bills are user assumptions, not verified source bill coverage.
start_month: 2026-10-01
saving_months: 12
participants:
  - participant_id: buyer
    net_annual_income:
      interpolation: linear
      milestones:
        - {month_offset: 0, amount_eur: 24000}
        - {month_offset: 24, amount_eur: 36000}
    monthly_debt:
      interpolation: step
      milestones:
        - {month_offset: 0, amount_eur: 100}
        - {month_offset: 12, amount_eur: 0}
    starting_savings_eur: 8000
  - participant_id: saver
    net_annual_income:
      interpolation: step
      milestones: [{month_offset: 0, amount_eur: 18000}]
    monthly_debt:
      interpolation: step
      milestones: [{month_offset: 0, amount_eur: 0}]
    starting_savings_eur: 2000
saver_ids: [buyer, saver]
borrower_ids: [buyer]
living_stages:
  - arrangement: room
    start_month_offset: 0
    end_month_offset: 3
    rent_share: 1
    rent_includes_utilities: true
  - arrangement: flat_alone
    start_month_offset: 3
    end_month_offset: 6
    rent_share: 1
    rental_area_m2: 55
    rent_includes_utilities: false
  - arrangement: flat_shared
    start_month_offset: 6
    end_month_offset: 12
    rent_share: 1
    rental_area_m2: 80
    rent_includes_utilities: false
household_nonhousing_expenses:
  # Effective cash spending changes explicitly when bills cease to be included.
  interpolation: step
  milestones:
    - {month_offset: 0, amount_eur: 700}
    - {month_offset: 3, amount_eur: 900}
mortgage:
  annual_nominal_interest_fraction: 0.035
market_selection:
  allow_pooled_property_proxy: true
market_policy:
  kind: growth
  base_month: 2026-10-01
  annual_rent_growth_fraction: 0.02
  annual_purchase_growth_fraction: 0.03
locations:
  mode: local_local
  saving_location: {kind: mapped}
  buying_location: {kind: mapped}
