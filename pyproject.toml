[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "spain-housing"
version = "0.1.0"
description = "Foundations for a Spain housing affordability simulator"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "shapely>=2.1,<3",
    "openpyxl>=3.1,<4",
    "pyproj>=3.7,<4",
]

[project.optional-dependencies]
map = ["streamlit>=1.65,<2", "pydeck>=0.9.3,<1"]

[project.scripts]
spain-housing = "spain_housing.cli:main"

[dependency-groups]
dev = ["import-linter>=2.3,<3", "mypy>=1.15,<2", "pytest>=8,<10", "ruff>=0.11,<1", "types-PyYAML>=6,<7", "types-shapely>=2.1,<3", "types-openpyxl>=3.1,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/spain_housing"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/spain_housing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "spain_housing"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "models do not depend on implementations"
type = "forbidden"
source_modules = ["spain_housing.models"]
forbidden_modules = ["spain_housing.storage", "spain_housing.finance", "spain_housing.markets", "spain_housing.ingestion", "spain_housing.application", "spain_housing.ui", "spain_housing.config", "spain_housing.cli"]

[[tool.importlinter.contracts]]
name = "finance has no providers or interface dependencies"
type = "forbidden"
source_modules = ["spain_housing.finance"]
forbidden_modules = ["spain_housing.storage", "spain_housing.markets", "spain_housing.ingestion", "spain_housing.application", "spain_housing.ui", "spain_housing.config", "spain_housing.cli"]

[[tool.importlinter.contracts]]
name = "market access has no acquisition or interface dependencies"
type = "forbidden"
source_modules = ["spain_housing.markets"]
forbidden_modules = ["spain_housing.finance", "spain_housing.ingestion", "spain_housing.application", "spain_housing.ui", "spain_housing.config", "spain_housing.cli"]

[[tool.importlinter.contracts]]
name = "ingestion has no evaluation dependencies"
type = "forbidden"
source_modules = ["spain_housing.ingestion"]
forbidden_modules = ["spain_housing.finance", "spain_housing.markets", "spain_housing.application", "spain_housing.ui", "spain_housing.config", "spain_housing.cli"]

[[tool.importlinter.contracts]]
name = "pure market rules have no storage dependencies"
type = "forbidden"
source_modules = ["spain_housing.markets.selection", "spain_housing.markets.projections", "spain_housing.markets.coverage"]
forbidden_modules = ["spain_housing.markets.repository", "spain_housing.storage"]

[[tool.importlinter.contracts]]
name = "application has no interface or ingestion dependencies"
type = "forbidden"
source_modules = ["spain_housing.application"]
forbidden_modules = ["spain_housing.storage", "spain_housing.ingestion", "spain_housing.ui", "spain_housing.config", "spain_housing.cli"]

[[tool.importlinter.contracts]]
name = "config has only model dependencies"
type = "forbidden"
source_modules = ["spain_housing.config"]
forbidden_modules = ["spain_housing.storage", "spain_housing.finance", "spain_housing.markets", "spain_housing.ingestion", "spain_housing.application", "spain_housing.ui", "spain_housing.cli"]

[[tool.importlinter.contracts]]
name = "UI does not bypass application"
type = "forbidden"
source_modules = ["spain_housing.ui"]
forbidden_modules = ["spain_housing.storage", "spain_housing.finance", "spain_housing.markets", "spain_housing.ingestion", "spain_housing.config", "spain_housing.cli"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "storage has only model dependencies"
type = "forbidden"
source_modules = ["spain_housing.storage"]
forbidden_modules = ["spain_housing.ingestion", "spain_housing.markets", "spain_housing.finance", "spain_housing.application", "spain_housing.config", "spain_housing.cli", "spain_housing.ui"]

[[tool.importlinter.contracts]]
name = "lower layers never import launcher"
type = "forbidden"
source_modules = ["spain_housing.models", "spain_housing.finance", "spain_housing.markets", "spain_housing.storage", "spain_housing.ingestion", "spain_housing.application", "spain_housing.config", "spain_housing.ui"]
forbidden_modules = ["spain_housing.launcher"]
allow_indirect_imports = true
